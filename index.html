<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Menú Bar Offline</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    html, body {
      width: 100vw; height: 100vh;
      background-color: #000;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #setup {
      color: #fff; text-align: center; padding: 24px;
      background: #18181b; border-radius: 16px;
      border: 1px solid #3f3f46; max-width: 90%; width: 380px;
    }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 99px;
      font-size: 12px; font-weight: 600; margin-bottom: 12px;
      background: #3f3f46; color: #d4d4d8;
    }
    .badge.ready { background: #14532d; color: #86efac; }
    .btn {
      background: #eab308; color: #000; font-weight: 700;
      padding: 16px 28px; border-radius: 10px; cursor: pointer;
      display: inline-block; font-size: 18px; border: none;
      margin-top: 12px; width: 100%;
    }
    .btn-start { background: #22c55e; color: #fff; display: none; margin-top: 16px; }
    input[type="file"] { display: none; }
    #menu-img {
      display: none; width: 100vw; height: 100vh; object-fit: contain;
    }
    #secret-reset {
      position: fixed; top: 0; left: 0; width: 80px; height: 80px;
      z-index: 9999; display: none;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div id="setup">
    <span id="offline-badge" class="badge">⏳ Preparando modo sin internet...</span>
    <h2 style="margin-bottom: 8px;">Menú Modo Kiosco</h2>
    <p id="status-text" style="color: #a1a1aa; font-size: 14px; margin-bottom: 16px;">
      Elige la imagen de tu menú (se quedará guardada en la tablet)
    </p>
    
    <label for="file-input" class="btn">📁 Seleccionar Imagen</label>
    <input type="file" id="file-input" accept="image/*">

    <button id="start-btn" class="btn btn-start">🔒 Activar Pantalla Completa</button>
  </div>

  <img id="menu-img" alt="Menú" draggable="false">
  <div id="secret-reset"></div>

  <script>
    const fileInput = document.getElementById('file-input');
    const startBtn = document.getElementById('start-btn');
    const setupDiv = document.getElementById('setup');
    const statusText = document.getElementById('status-text');
    const offlineBadge = document.getElementById('offline-badge');
    const menuImg = document.getElementById('menu-img');
    const secretReset = document.getElementById('secret-reset');
    let wakeLock = null;

    // 1. Registrar Service Worker para que abra SIN INTERNET
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(() => {
        navigator.serviceWorker.ready.then(() => {
          offlineBadge.textContent = '✅ Listo para usar SIN INTERNET';
          offlineBadge.classList.add('ready');
        });
      });
    }

    // 2. Base de datos local (IndexedDB) para guardar imágenes pesadas sin límite
    function abrirDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('MenuBarDB', 1);
        req.onupgradeneeded = (e) => e.target.result.createObjectStore('imagenes');
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e);
      });
    }

    async function guardarImagenDB(blob) {
      const db = await abrirDB();
      const tx = db.transaction('imagenes', 'readwrite');
      tx.objectStore('imagenes').put(blob, 'menu_actual');
    }

    async function cargarImagenDB() {
      const db = await abrirDB();
      return new Promise((resolve) => {
        const tx = db.transaction('imagenes', 'readonly');
        const req = tx.objectStore('imagenes').get('menu_actual');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    // Al abrir la app, recuperar la imagen guardada aunque no haya internet
    cargarImagenDB().then((blob) => {
      if (blob) {
        menuImg.src = URL.createObjectURL(blob);
        statusText.textContent = '¡Tu menú ya está guardado en la memoria de la tablet!';
        startBtn.style.display = 'inline-block';
      }
    });

    // Seleccionar nueva imagen y guardarla en IndexedDB
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      menuImg.src = URL.createObjectURL(file);
      await guardarImagenDB(file);
      statusText.textContent = '¡Imagen guardada para modo sin internet!';
      startBtn.style.display = 'inline-block';
    });

    // WakeLock y Pantalla Completa
    async function activarWakeLock() {
      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      }
    }

    async function entrarPantallaCompleta() {
      const el = document.documentElement;
      try {
        if (!document.fullscreenElement) {
          if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: "hide" });
          else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
        }
      } catch (e) {}
    }

    startBtn.addEventListener('click', async () => {
      setupDiv.style.display = 'none';
      menuImg.style.display = 'block';
      secretReset.style.display = 'block';
      await entrarPantallaCompleta();
      await activarWakeLock();
    });

    menuImg.addEventListener('touchstart', async (e) => {
      e.preventDefault();
      await entrarPantallaCompleta();
      if (!wakeLock || wakeLock.released) await activarWakeLock();
    }, { passive: false });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && menuImg.style.display === 'block') {
        activarWakeLock();
      }
    });

    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gesturestart', (e) => e.preventDefault());

    // 5 toques rápidos en la esquina superior izquierda para salir
    let taps = 0, lastTap = 0;
    secretReset.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      const now = Date.now();
      taps = (now - lastTap < 500) ? taps + 1 : 1;
      lastTap = now;
      if (taps >= 5) {
        taps = 0;
        if (document.fullscreenElement) document.exitFullscreen();
        menuImg.style.display = 'none';
        secretReset.style.display = 'none';
        setupDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
